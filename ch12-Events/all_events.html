<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .box {
            width: 250px;
            height: 100px;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        input,
        select,
        button {
            padding: 10px;
            margin: 5px;
        }

        #output {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Events</h1>

    <!-- CLICK EVENT -->
    <h2>1. Click Event</h2>

    <button id="clickBtn">Click Me</button>


    <!-- DOUBLE CLICK EVENT -->
    <h2>2. Double Click Event</h2>

    <button id="doubleBtn">Double Click Me</button>


    <!-- MOUSEOVER AND MOUSEOUT -->
    <h2>3. Mouse Events</h2>

    <div id="box" class="box">
        Move Mouse Here
    </div>


    <!-- KEYDOWN AND KEYUP -->
    <h2>4. Keyboard Events</h2>

    <input
        id="nameInput"
        type="text"
        placeholder="Type something"
    >

    <p id="keyOutput"></p>


    <!-- INPUT EVENT -->
    <h2>5. Input Event</h2>

    <input
        id="inputBox"
        type="text"
        placeholder="Enter your name"
    >

    <p id="inputOutput"></p>


    <!-- CHANGE EVENT -->
    <h2>6. Change Event</h2>

    <select id="city">

        <option value="">Choose a city</option>

        <option value="Mogadishu">
            Mogadishu
        </option>

        <option value="Hargeisa">
            Hargeisa
        </option>

        <option value="Kismayo">
            Kismayo
        </option>

    </select>

    <p id="cityOutput"></p>


    <!-- FOCUS AND BLUR -->
    <h2>7. Focus and Blur Events</h2>

    <input
        id="focusInput"
        type="text"
        placeholder="Click inside me"
    >


    <!-- SUBMIT EVENT -->
    <h2>8. Submit Event</h2>

    <form id="myForm">

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Submit
        </button>

    </form>


    <!-- SCROLL EVENT -->
    <h2>9. Scroll Event</h2>

    <p>
        Scroll the page and check your console.
    </p>

    <div style="height: 800px;"></div>


    <script>

        // =========================================
        // 1. CLICK EVENT
        // =========================================

        let clickBtn = document.getElementById("clickBtn");

        clickBtn.addEventListener("click", function() {

            alert("You clicked the button!");

        });


        // =========================================
        // 2. DOUBLE CLICK EVENT
        // =========================================

        let doubleBtn = document.getElementById("doubleBtn");

        doubleBtn.addEventListener("dblclick", function() {

            alert("You double-clicked the button!");

        });


        // =========================================
        // 3. MOUSEOVER EVENT
        // =========================================

        let box = document.getElementById("box");

        box.addEventListener("mouseover", function() {

            box.style.backgroundColor = "lightgreen";

            box.textContent = "Mouse is inside!";

        });


        // =========================================
        // 4. MOUSEOUT EVENT
        // =========================================

        box.addEventListener("mouseout", function() {

            box.style.backgroundColor = "lightblue";

            box.textContent = "Mouse left!";

        });


        // =========================================
        // 5. KEYDOWN EVENT
        // =========================================

        let nameInput = document.getElementById("nameInput");

        let keyOutput = document.getElementById("keyOutput");

        nameInput.addEventListener("keydown", function(event) {

            keyOutput.textContent =
                "You pressed: " + event.key;

        });


        // =========================================
        // 6. KEYUP EVENT
        // =========================================

        nameInput.addEventListener("keyup", function(event) {

            console.log(
                "You released: " + event.key
            );

        });


        // =========================================
        // 7. INPUT EVENT
        // =========================================

        let inputBox = document.getElementById("inputBox");

        let inputOutput = document.getElementById("inputOutput");

        inputBox.addEventListener("input", function() {

            inputOutput.textContent =
                "Hello " + inputBox.value;

        });


        // =========================================
        // 8. CHANGE EVENT
        // =========================================

        let city = document.getElementById("city");

        let cityOutput =
            document.getElementById("cityOutput");

        city.addEventListener("change", function() {

            cityOutput.textContent =
                "You selected: " + city.value;

        });


        // =========================================
        // 9. FOCUS EVENT
        // =========================================

        let focusInput =
            document.getElementById("focusInput");

        focusInput.addEventListener("focus", function() {

            focusInput.style.backgroundColor = "yellow";

            console.log("Input is focused");

        });


        // =========================================
        // 10. BLUR EVENT
        // =========================================

        focusInput.addEventListener("blur", function() {

            focusInput.style.backgroundColor = "white";

            console.log("Input lost focus");

        });


        // =========================================
        // 11. SUBMIT EVENT
        // =========================================

        let form = document.getElementById("myForm");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Form submitted successfully!");

        });


        // =========================================
        // 12. LOAD EVENT
        // =========================================

        window.addEventListener("load", function() {

            console.log("The page has loaded!");

        });


        // =========================================
        // 13. SCROLL EVENT
        // =========================================

        window.addEventListener("scroll", function() {

            console.log("You are scrolling!");

        });

    </script>

</body>
</html>
